<style>
/* Layout: one full-bleed glyph canvas; a thin header strip and a bottom chat dock float above it. */
:root {
  --bg: #131314;
  --panel: rgba(24, 25, 28, 0.92);
  --panel-solid: #1b1c20;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.13);
  --fg: #ebecef;
  --fg-dim: #a1a5ae;
  --fg-faint: #6b707a;
  --warn: #e2a55c;
  --glyph: #2a74b0;
  --accent: #5ea1dc;
  --accent-ink: #0b1118;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  --sw-steel: #3b86c6;
  --sw-ember: #d27c45;
  --sw-moss: #57a565;
  --sw-lilac: #9378db;
  --sw-mono: #a9adb5;
  --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f2f4;
    --panel: rgba(255, 255, 255, 0.93);
    --panel-solid: #ffffff;
    --line: rgba(16, 24, 40, 0.09);
    --line-strong: rgba(16, 24, 40, 0.17);
    --fg: #14161b;
    --fg-dim: #535966;
    --fg-faint: #858b96;
    --warn: #9a5a06;
    --glyph: #1c5f9f;
    --accent: #1f65ad;
    --accent-ink: #ffffff;
    --shadow: 0 18px 48px rgba(16, 24, 40, 0.16);
    --sw-steel: #1f65ad;
    --sw-ember: #b4561f;
    --sw-moss: #2f7d40;
    --sw-lilac: #6a4cc2;
    --sw-mono: #3d4149;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f1f2f4;
  --panel: rgba(255, 255, 255, 0.93);
  --panel-solid: #ffffff;
  --line: rgba(16, 24, 40, 0.09);
  --line-strong: rgba(16, 24, 40, 0.17);
  --fg: #14161b;
  --fg-dim: #535966;
  --fg-faint: #858b96;
  --warn: #9a5a06;
  --glyph: #1c5f9f;
  --accent: #1f65ad;
  --accent-ink: #ffffff;
  --shadow: 0 18px 48px rgba(16, 24, 40, 0.16);
  --sw-steel: #1f65ad;
  --sw-ember: #b4561f;
  --sw-moss: #2f7d40;
  --sw-lilac: #6a4cc2;
  --sw-mono: #3d4149;
  color-scheme: light;
}
/* Glyph palettes: dark values first, then the light-theme versions. */
:root[data-palette="ember"] { --glyph: #bf6a35; --accent: #e3925a; }
:root[data-palette="moss"]  { --glyph: #3d8c4b; --accent: #72c07f; }
:root[data-palette="lilac"] { --glyph: #7a5fc6; --accent: #a691ea; }
:root[data-palette="mono"]  { --glyph: #9a9ea6; --accent: #d5d7dc; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"])[data-palette="ember"] { --glyph: #a54f1b; --accent: #b0541f; }
  :root:not([data-theme="dark"])[data-palette="moss"]  { --glyph: #2a7339; --accent: #2e7a3d; }
  :root:not([data-theme="dark"])[data-palette="lilac"] { --glyph: #5d40b3; --accent: #6448bd; }
  :root:not([data-theme="dark"])[data-palette="mono"]  { --glyph: #33363c; --accent: #2a2d33; }
}
:root[data-theme="light"][data-palette="ember"] { --glyph: #a54f1b; --accent: #b0541f; }
:root[data-theme="light"][data-palette="moss"]  { --glyph: #2a7339; --accent: #2e7a3d; }
:root[data-theme="light"][data-palette="lilac"] { --glyph: #5d40b3; --accent: #6448bd; }
:root[data-theme="light"][data-palette="mono"]  { --glyph: #33363c; --accent: #2a2d33; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; }

.chrome {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 16px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}

/* Header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 7px; user-select: none; min-width: 0; }
.brand-name {
  font: 500 12px/1 var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--fg-dim);
}
.legend {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  font: 11px/1.4 var(--font-mono);
  color: var(--fg-faint);
}
.legend kbd {
  font: inherit;
  color: var(--fg-dim);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  padding: 0 5px;
  margin-right: 5px;
}
.legend .touch { display: none; }
@media (pointer: coarse) {
  .legend .mouse { display: none; }
  .legend .touch { display: inline; }
}

.tweaks { position: relative; pointer-events: auto; flex: none; }
.tweaks-btn {
  display: flex; align-items: center; gap: 8px;
  font: 500 12px/1 var(--font-mono);
  color: var(--fg-dim);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
  cursor: pointer;
}
.tweaks-btn:hover, .tweaks-btn[aria-expanded="true"] { color: var(--fg); border-color: var(--line-strong); }
.tweaks-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tweaks-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  width: 244px;
  display: grid; gap: 14px;
  background: var(--panel-solid);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow);
  z-index: 5;
}
.tweaks-panel fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.tweaks-panel legend {
  padding: 0;
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--fg-faint);
}
.swatches { display: flex; gap: 8px; }
.sw {
  width: 30px; height: 30px; border-radius: 9px;
  border: 1px solid var(--line-strong);
  background: transparent;
  padding: 0; cursor: pointer;
  display: grid; place-items: center;
}
.sw span { width: 16px; height: 16px; border-radius: 5px; }
.sw[aria-pressed="true"] { border-color: var(--fg-dim); box-shadow: inset 0 0 0 1px var(--fg-dim); }
.sw[data-palette="steel"] span { background: var(--sw-steel); }
.sw[data-palette="ember"] span { background: var(--sw-ember); }
.sw[data-palette="moss"] span { background: var(--sw-moss); }
.sw[data-palette="lilac"] span { background: var(--sw-lilac); }
.sw[data-palette="mono"] span { background: var(--sw-mono); }
.tweaks-note { margin: 0; font: 11px/1.45 var(--font-mono); color: var(--fg-faint); }

.seg {
  display: inline-flex; gap: 2px; padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
}
.seg button {
  font: 500 11.5px/1 var(--font-mono);
  color: var(--fg-faint);
  background: transparent;
  border: 0; border-radius: 7px;
  padding: 6px 9px;
  cursor: pointer;
}
.seg button:hover { color: var(--fg-dim); }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] {
  color: var(--fg);
  background: color-mix(in srgb, var(--fg) 10%, transparent);
}

/* Chat dock */
.dock {
  width: min(680px, 100%);
  margin-inline: auto;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0;
}
.dock > * { pointer-events: auto; }
.thread {
  display: flex; flex-direction: column;
  max-height: min(44vh, 440px);
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.thread-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 6px 6px 14px;
  border-bottom: 1px solid var(--line);
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--fg-faint);
}
.thread-head .actions { display: flex; gap: 2px; }
.ghost {
  font: 500 11px/1 var(--font-mono);
  color: var(--fg-faint);
  background: transparent;
  border: 0; border-radius: 7px;
  padding: 7px 9px;
  cursor: pointer;
}
.ghost:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 7%, transparent); }
.thread.collapsed .msgs { display: none; }
.thread.collapsed .thread-head { border-bottom-color: transparent; }
.msgs {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px;
  display: flex; flex-direction: column; gap: 14px;
  min-height: 0;
}
.msg { font-size: 15px; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.msg.user {
  align-self: flex-end;
  max-width: 85%;
  padding: 7px 12px;
  white-space: pre-wrap;
  background: color-mix(in srgb, var(--accent) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
  border-radius: 12px 12px 4px 12px;
}
.msg.assistant .who {
  margin-bottom: 5px;
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--accent);
}
.body p { margin: 0 0 0.6em; }
.body p:last-child, .body ul:last-child, .body ol:last-child, .body pre:last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 0.2em 0 0.6em; padding-left: 1.3em; }
.body li { margin: 0.15em 0; }
.body a { color: var(--accent); }
.body code {
  font: 13px/1.4 var(--font-mono);
  background: color-mix(in srgb, var(--fg) 8%, transparent);
  border-radius: 5px;
  padding: 1px 5px;
}
.body pre {
  margin: 0.4em 0 0.6em;
  padding: 10px 12px;
  overflow-x: auto;
  font: 12.5px/1.5 var(--font-mono);
  background: color-mix(in srgb, var(--fg) 6%, transparent);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.body pre code { background: none; padding: 0; font: inherit; }
.think { display: inline-flex; align-items: center; gap: 8px; font: 12px/1.4 var(--font-mono); color: var(--fg-faint); }
.think .scr { color: var(--accent); letter-spacing: 0.08em; }
.note { margin-top: 6px; font: 11.5px/1.45 var(--font-mono); color: var(--fg-faint); }
.note.err { color: var(--warn); }

.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip {
  font: 13.5px/1.2 var(--font-ui);
  color: var(--fg-dim);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 7px 13px;
  cursor: pointer;
}
.chip:hover { color: var(--fg); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }

.composer {
  display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 8px 8px 14px;
  background: var(--panel-solid);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-strong)); }
.composer textarea {
  flex: 1; min-width: 0;
  resize: none; border: 0; outline: 0;
  background: transparent;
  color: var(--fg);
  font: 15px/1.45 var(--font-ui);
  padding: 6px 0;
  box-sizing: border-box;
  height: 34px; max-height: 168px;
}
.composer textarea::placeholder { color: var(--fg-faint); }
.composer textarea:disabled { cursor: not-allowed; }
.send {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.send:disabled { opacity: 0.35; cursor: default; }
.send svg { width: 16px; height: 16px; }
.send .i-stop { display: none; }
.send.busy .i-send { display: none; }
.send.busy .i-stop { display: block; }

.meta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  min-height: 26px;
  padding: 0 2px;
  font: 11.5px/1.3 var(--font-mono);
  color: var(--fg-faint);
}
.status { min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status.warn { color: var(--warn); white-space: normal; }

@media (max-width: 520px) {
  .thread { max-height: 40vh; }
  .chip { font-size: 13px; padding: 6px 11px; }
  .meta .status:not(.warn) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

        <svg class="i-send" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
      </button>
    </form>
    <div class="meta">
      <div class="seg" id="tierSeg" role="radiogroup" aria-label="Reply style">
        <button type="button" role="radio" data-tier="quick" aria-checked="true" title="Fast, short replies">Quick</button>
        <button type="button" role="radio" data-tier="deep" aria-checked="false" title="Claude thinks before answering">Deep</button>
      </div>
      <span class="status" id="status" aria-live="polite">Enter to send · Shift+Enter for a new line</span>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const root = document.documentElement;
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  const lightMQ = matchMedia('(prefers-color-scheme: light)');
  const coarseMQ = matchMedia('(pointer: coarse)');
  const MONO = '"JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace';
  const SANS = '"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const PALETTES = ['steel', 'ember', 'moss', 'lilac', 'mono'];
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const nowS = () => performance.now() / 1000;

  /* ================================================================
     Field engine
     A grid of monospace cells. Two energy sources light it up:
       - glow:  a faint trail painted by pointer movement; it eases in,
                spreads slowly (diffusion) and fades over a few seconds.
       - rings: click ripples. The front decelerates (r = R(1 - e^-t/tau)),
                a bright crest leads, a weaker second ring trails ~100px
                behind, and the cells it crosses scramble and keep a faint
                residue that joins the glow.
     Each frame the cells are packed into a small buffer (glyph index +
     opacity) and drawn in one WebGL pass that samples a glyph atlas; a 2D
     canvas path with pre-tinted opacity levels is the fallback.
     ================================================================ */

  // Paints one row of glyphs, one per cell, in the context's current fill style.
  function paintGlyphRow(ctx2d, chars, font, cwD, chD, y0, dpr) {
    ctx2d.font = font;
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    for (let j = 0; j < chars.length; j++) ctx2d.fillText(chars[j], j * cwD + cwD / 2, y0 + chD / 2 + dpr * 0.5);
  }

  function makeGLRenderer(canvas) {
    let gl = null;
    try {
      gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });
    } catch (e) { gl = null; }
    if (!gl) return null;
    const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
    const FS = [
      '#ifdef GL_FRAGMENT_PRECISION_HIGH', 'precision highp float;', '#else', 'precision mediump float;', '#endif',
      'uniform sampler2D uCells;uniform sampler2D uAtlas;',
      'uniform vec2 uCell;uniform vec2 uGrid;uniform float uN;uniform float uH;uniform vec3 uColor;',
      'void main(){',
      '  vec2 px=vec2(gl_FragCoord.x,uH-gl_FragCoord.y);',
      '  vec2 cell=floor(px/uCell);',
      '  vec4 c=texture2D(uCells,(cell+0.5)/uGrid);',
      '  if(c.g<=0.0)discard;',
      '  vec2 inC=px-cell*uCell;',
      '  float gi=floor(c.r*255.0+0.5);',
      '  float cov=texture2D(uAtlas,vec2((gi*uCell.x+inC.x)/(uN*uCell.x),inC.y/uCell.y)).a;',
      '  float a=cov*c.g;',
      '  gl_FragColor=vec4(uColor*a,a);',
      '}',
    ].join('\n');
    let prog, loc, cellsTex, atlasTex, buf;
    let state = { pw: 1, ph: 1, cwD: 13, chD: 26, cols: 1, rows: 1, chars: '', font: '', dpr: 1, rgb: [42, 116, 176] };

      for (let i = 0, o = 0; i < n; i++, o += 4) {
        const g = glow[i] * (0.45 + nz[i]);
        const r = ringE[i] * jit[i];
        let a = r + g - r * g;
        if (a < aMin) { vis[i] = 0; buf[o + 1] = 0; continue; }
        if (a > 1) a = 1;
        if (vis[i] === 0) { vis[i] = 1; glyph[i] = pick(); }
        const q = (a * 2047) | 0;
        buf[o] = ramp ? rampLUT[q] : glyph[i];
        buf[o + 1] = alphaLUT[q];
      }
      renderer.draw(buf);
    }

    function loop(ts) {
      const now = ts / 1000;
      let dt = lastTs ? now - lastTs : C.step;
      lastTs = now;
      if (dt > 0.1) dt = 0.1;
      if (sweep) runSweep(now);
      consumePath();
      acc += dt;
      let steps = 0;
      while (acc >= C.step && steps < 3) { simStep(C.step); acc -= C.step; steps++; }
      if (steps === 3) acc = 0;
      if (pulseAt && now >= nextPulse) {
        const pt = pulseAt();
        if (pt) addRipple(pt[0], pt[1], 0.5, 0.42);
        nextPulse = now + 1.5;
      }
      const ringsAlive = computeRings(now);
      draw();
      const alive = ringsAlive || pendAny || glowMax * 1.45 > C.aMin || path.length > 0 || sweep || pulseAt;
      if (alive) requestAnimationFrame(loop);
      else {
        running = false;
        lastTs = 0;
        glow.fill(0);
        renderer.clear();
      }
    }

    function wake() {
      if (running || !n) return;
      running = true;
      lastTs = 0;
      acc = 0;
      requestAnimationFrame(loop);
    }

    function addRipple(x, y, amp = 1, scale = 1, delay = 0) {
      if (!n) return;
      if (ripples.length >= C.maxRipples) ripples.shift();
      ripples.push({
        x, y, amp,
        lead: C.lead * Math.min(1, scale),
        R: C.rippleR * viewScale * scale,
        tau: C.rippleTau * (0.75 + 0.25 * Math.min(1, scale)),
        t0: nowS() + delay,
      });
      wake();
    }

    function rippleAtEl(el, amp = 1, scale = 1) {
      if (!el) return;
      const b = el.getBoundingClientRect();
      addRipple(b.left + b.width / 2, b.top + Math.min(b.height / 2, 18), amp, scale);
    }

    /* ---------- intro sweep ---------- */
    function runSweep(now) {
      const s = sweep;
      const u = (now - s.t0) / s.dur;
      if (u < 0) return;
      const uu = Math.min(1, u);
      const e = uu < 0.5 ? 2 * uu * uu : 1 - Math.pow(-2 * uu + 2, 2) / 2;
      const x = s.x0 + (s.x1 - s.x0) * e;
      const y = s.y + Math.sin(uu * Math.PI * 1.6) * s.amp;
      if (s.has) depositSegment(s.lx, s.ly, x, y);
      s.lx = x; s.ly = y; s.has = true;
      if (u >= 1) sweep = null;
    }

    function intro() {
      if (reduceMQ.matches || !n) return;
      addRipple(W * 0.5, H * 0.34, 1, 1, 0.1);
      sweep = { t0: nowS() + 0.45, dur: 1.6, x0: W * 0.1, x1: W * 0.9, y: H * 0.56, amp: H * 0.05, has: false, lx: 0, ly: 0 };
      wake();
    }

    /* ---------- writing words into the field ---------- */
    async function etchText(text) {
      const word = String(text).replace(/\s+/g, ' ').trim().slice(0, 14);
      if (!word || !n) return '';
      try {
        await Promise.race([document.fonts.load(`700 64px ${SANS}`), new Promise(r => setTimeout(r, 600))]);
      } catch (e) { /* fall back to whatever is loaded */ }
      etchCanvas.width = cols;
      etchCanvas.height = rows;
      const c = etchCanvas.getContext('2d', { willReadFrequently: true });
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, cols, rows);
      const sy = cw / ch; // cells are taller than wide: squash vertically so letters keep their shape
      const capPx = Math.min(H * 0.24, W * 0.2, 190);
      let fx = (capPx / 0.72) / cw;
      c.font = `700 ${fx}px ${SANS}`;
      let tw = c.measureText(word).width;
      const maxW = cols * 0.86;
      if (tw > maxW) { fx *= maxW / tw; c.font = `700 ${fx}px ${SANS}`; tw = maxW; }
      c.setTransform(1, 0, 0, sy, 0, 0);
      c.fillStyle = '#fff';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      const cyRows = rows * 0.4;
      c.fillText(word, cols / 2, cyRows / sy);
      const data = c.getImageData(0, 0, cols, rows).data;
      const cells = [], mask = [];
      for (let i = 0; i < n; i++) {
        const a = data[i * 4 + 3] / 255;
        if (a > 0.1) { cells.push(i); mask.push(a); }
      }
      etch = {
        t0: nowS(), hold: 5.2,
        cells: Int32Array.from(cells), mask: Float32Array.from(mask),
        x0: (cols - tw) / 2, x1: (cols + tw) / 2,
      };
      addRipple(W / 2, cyRows * ch, 0.85, 1);
      return word;
    }

    function setGlyphSet(name) {
      if (!SETS[name] || name === setName) return;
      setName = name;
      buildPickLUT();
      for (let i = 0; i < n; i++) glyph[i] = pick();
      buildAtlas();
      wake();
    }

    function refreshColors() { buildAtlas(); wake(); }

    function setPulse(fn) {
      pulseAt = reduceMQ.matches ? null : fn;
      nextPulse = nowS() + 0.9;
      if (pulseAt) wake();
    }

    function streamPulse(x0, x1, y, size) {
      if (reduceMQ.matches) return;
      const x = x0 + rand() * (x1 - x0);
      addRipple(x, y, clamp(0.25 + size / 120, 0.25, 0.5), 0.3);
    }

    /* ---------- pointer input ---------- */
    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      addRipple(e.clientX, e.clientY, 1);
      path.push(NaN, NaN, e.clientX, e.clientY);
      wake();
    });
    canvas.addEventListener('pointermove', e => {
      const list = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : null;
      if (list && list.length) for (const p of list) path.push(p.clientX, p.clientY);
      else path.push(e.clientX, e.clientY);
      wake();
    }, { passive: true });
    const breakStroke = () => { path.push(NaN, NaN); };
    canvas.addEventListener('pointerleave', breakStroke);
    canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') breakStroke(); });
    canvas.addEventListener('pointercancel', breakStroke);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

    buildPickLUT();
    return {
      resize, intro, wake,
      ripple: addRipple, rippleAtEl, etch: etchText,
      setGlyphSet, refreshColors, setPulse, streamPulse,
      get setName() { return setName; },
    };
  })();

  /* ================================================================
     Tweaks: palette and glyph set (remembered per viewer)
     ================================================================ */
  const tweaksBtn = document.getElementById('tweaksBtn');
  const tweaksPanel = document.getElementById('tweaksPanel');
  const swatches = [...document.querySelectorAll('.sw')];
  const glyphBtns = [...document.querySelectorAll('#glyphSeg button')];

  function currentPalette() { return root.dataset.palette || 'steel'; }
  function setPalette(name) {
    if (!PALETTES.includes(name)) return;
    if (name === 'steel') delete root.dataset.palette; else root.dataset.palette = name;
    swatches.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.palette === name)));
    store.set('arf.palette', name);
  }
  function setGlyphs(name) {
    Field.setGlyphSet(name);
    glyphBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === name)));
    store.set('arf.glyphs', name);
  }
  function openTweaks(open) {
    tweaksPanel.hidden = !open;
    tweaksBtn.setAttribute('aria-expanded', String(open));
  }
  tweaksBtn.addEventListener('click', () => openTweaks(tweaksPanel.hidden));
  swatches.forEach(b => b.addEventListener('click', () => setPalette(b.dataset.palette)));
  glyphBtns.forEach(b => b.addEventListener('click', () => setGlyphs(b.dataset.set)));
  document.addEventListener('pointerdown', e => {
    if (!tweaksPanel.hidden && !e.target.closest('.tweaks')) openTweaks(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !tweaksPanel.hidden) { openTweaks(false); tweaksBtn.focus(); }
  });

  const savedPalette = store.get('arf.palette');
  if (savedPalette && PALETTES.includes(savedPalette)) setPalette(savedPalette);
  const savedGlyphs = store.get('arf.glyphs');
  if (savedGlyphs === 'binary' || savedGlyphs === 'ramp') {
    Field.setGlyphSet(savedGlyphs);
    glyphBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === savedGlyphs)));
  }

  new MutationObserver(() => Field.refreshColors()).observe(root, { attributes: true, attributeFilter: ['data-theme', 'data-palette'] });
  lightMQ.addEventListener('change', () => Field.refreshColors());

  /* ================================================================
     Chat with Claude (the artifact's `sample` capability)
     ================================================================ */
  const els = {
    dock: document.getElementById('dock'),
    thread: document.getElementById('thread'),
    msgs: document.getElementById('msgs'),
    chips: document.getElementById('chips'),
    form: document.getElementById('composer'),
    input: document.getElementById('prompt'),
    send: document.getElementById('sendBtn'),
    status: document.getElementById('status'),
    clear: document.getElementById('clearBtn'),
    collapse: document.getElementById('collapseBtn'),
    tierBtns: [...document.querySelectorAll('#tierSeg button')],
  };
  const CODECHARS = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const ERR = {
    not_granted: 'Claude access was declined for this page, so chat is off. Reload to be asked again.',
    sampling_disabled: 'Claude isn’t available on this account, so chat is off. The field still works.',
    not_declared: 'This version of the page can’t reach Claude.',
    capability_disabled: 'Claude can’t be reached from this view. The field still works.',
    capability_removed: 'This Claude app is too old for this chat. Update it to chat here.',
    rate_limited: 'Too many messages in a short time. Wait a moment, then send again.',
    session_expired: 'Your Claude session expired. Sign in again, then resend.',
    refused: 'Claude declined that one. Try asking a different way.',
    empty_completion: 'No reply came back. Try rephrasing.',
    prompt_too_large: 'The conversation got too long. Clear it and start again.',
    invalid_request: 'That message couldn’t be sent. Try rephrasing it.',
    upstream_error: 'The reply was interrupted. Send again to retry.',
  };
  const FATAL = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed']);
  const HINT = 'Enter to send · Shift+Enter for a new line';

  let sample = null, samplePromise = null, toolsOK = false, fatal = null;
  let turns = [];
  let busy = false, ctl = null, thinkTimer = null;
  let tier = store.get('arf.tier') === 'deep' ? 'deep' : 'quick';

  function setStatus(text, warn) {
    els.status.textContent = text;
    els.status.classList.toggle('warn', !!warn);
  }
  function setFatal(code) {
    fatal = code;
    const copy = code === 'outside'
      ? 'Open this page in Claude to chat. The field works anywhere.'
      : code === 'absent'
        ? 'Chat with Claude isn’t available in this view. The field still works.'
        : (ERR[code] || ERR.capability_disabled);
    setStatus(copy, true);
    els.input.disabled = true;
    els.input.placeholder = 'Chat is unavailable here';
    els.chips.hidden = true;
    updateSend();
  }

  function initSample() {
    if (window.claude && typeof window.claude.use === 'function') {
      samplePromise = window.claude.use('sample').then(async s => {
        sample = s || null;
        if (!sample) { setFatal('absent'); return null; }
        try {
          const lim = await sample.limits();
          toolsOK = !!(lim && lim.tools);
        } catch (e) { toolsOK = false; }
        renderChips();
        return sample;
      }, () => { setFatal('absent'); return null; });
    } else {
      samplePromise = Promise.resolve(null);
      setFatal('outside');
    }
  }

  function renderChips() {
    if (fatal) { els.chips.hidden = true; return; }
    const list = toolsOK
      ? ['How does this effect work?', 'Write HELLO in the field', 'Turn it green']
      : ['How does this effect work?', 'How would I build this?', 'Tell me a tiny story'];
    els.chips.replaceChildren(...list.map(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = t;
      b.addEventListener('click', () => send(t));
      return b;
    }));
    els.chips.hidden = turns.length > 0 || els.msgs.childElementCount > 0;
  }

  /* --- minimal, safe markdown: paragraphs, lists, code, bold, italics, links --- */
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inline(s) {
    let h = esc(s);
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    h = h.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return h.replace(/\n/g, '<br>');
  }
  function blocks(text) {
    let html = '', para = [], list = null;
    const flushPara = () => { if (para.length) { html += `<p>${inline(para.join('\n'))}</p>`; para = []; } };
    const flushList = () => {
      if (list) { html += `<${list.t}>${list.items.map(it => `<li>${inline(it)}</li>`).join('')}</${list.t}>`; list = null; }
    };
    for (const raw of text.split('\n')) {
      const line = raw.replace(/\s+$/, '');
      const ul = /^\s*[-*•]\s+(.*)$/.exec(line);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara();
        const t = ul ? 'ul' : 'ol';
        if (!list || list.t !== t) { flushList(); list = { t, items: [] }; }
        list.items.push((ul || ol)[1]);
        continue;
      }
      if (!line.trim()) { flushPara(); flushList(); continue; }
      flushList();
      para.push(line.replace(/^#{1,6}\s+/, ''));
    }
    flushPara(); flushList();
    return html;
  }
  // While a reply streams, close a dangling ** or ` so markers never flash on screen.
  function closeOpen(src) {
    if (((src.match(/```/g) || []).length) % 2 === 1) return src;
    let out = src;
    const outside = out.replace(/```[\s\S]*?```/g, '');
    if (((outside.match(/`/g) || []).length) % 2 === 1) out += '`';
    if (((outside.replace(/`[^`]*`/g, '').match(/\*\*/g) || []).length) % 2 === 1) out += '**';
    return out;
  }
  function renderMarkdown(src) {
    return src.split('```').map((part, idx) => {
      if (idx % 2 === 0) return blocks(part);
      const nl = part.indexOf('\n');
      const code = nl >= 0 && /^[\w+#.-]*$/.test(part.slice(0, nl).trim()) ? part.slice(nl + 1) : part;
      return `<pre><code>${esc(code.replace(/\n$/, ''))}</code></pre>`;
    }).join('');
  }

  function nearBottom() { return els.msgs.scrollHeight - els.msgs.scrollTop - els.msgs.clientHeight < 60; }
  function scrollToEnd(force) { if (force || nearBottom()) els.msgs.scrollTop = els.msgs.scrollHeight; }

  function showThread() {
    els.thread.hidden = false;
    els.chips.hidden = true;
  }
  function addMessage(role, text) {
    const el = document.createElement('div');
    el.className = `msg ${role}`;
    if (role === 'user') el.textContent = text;
    else {
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = 'claude';
      const body = document.createElement('div');
      body.className = 'body';
      const note = document.createElement('div');
      note.className = 'note';
      note.hidden = true;
      el.append(who, body, note);
    }
    els.msgs.appendChild(el);
    showThread();
    if (els.thread.classList.contains('collapsed')) setCollapsed(false);
    scrollToEnd(true);
    return el;
  }
  function setNote(note, text, err) {
    note.textContent = text;
    note.classList.toggle('err', !!err);
    note.hidden = !text;
  }
  function startThinking(body) {
    body.innerHTML = '<span class="think"><span class="scr" aria-hidden="true"></span><span>Thinking</span></span>';
    const scr = body.querySelector('.scr');
    const tick = () => {
      let s = '';
      for (let i = 0; i < 6; i++) s += CODECHARS[(Math.random() * CODECHARS.length) | 0];
      scr.textContent = s;
    };
    tick();
    if (!reduceMQ.matches) thinkTimer = setInterval(tick, 90);
  }
  function stopThinking() { clearInterval(thinkTimer); thinkTimer = null; }

  function dockTop() {
    const b = (els.thread.hidden ? els.form : els.thread).getBoundingClientRect();
    return b;
  }
  const pulsePoint = () => { const b = dockTop(); return [b.left + b.width / 2, b.top]; };

  function rules(withTools) {
    const lines = [
      'You are Claude, chatting with a visitor through a small text box on a web page.',
      'The page background is an interactive ASCII ripple field: a grid of tiny monospace characters that stays dark until the visitor touches it. Moving the pointer leaves a faint trail of characters that spreads and fades. Clicking sends a bright ring of scrambling characters outward from that point; the ring slows as it grows, a weaker second ring follows it, and it fades after a couple of seconds. It recreates an animated background from the Claude desktop app’s Code mode, drawn on a canvas from a pre-rendered glyph atlas.',
      `Current look: ${currentPalette()} color, ${Field.setName === 'code' ? 'letters and digits' : Field.setName === 'binary' ? 'binary 0 and 1' : 'a density ramp of . : + # @'} as glyphs.`,
      '',
      'How to reply:',
      '- Use the visitor’s language. Be warm, direct and brief: usually one to four sentences. Go longer only when the visitor asks for detail or code.',
      '- Plain text. You may use **bold**, `inline code`, short "- " bullet lists and fenced code blocks. No headings, no tables.',
    ];
    if (withTools) {
      lines.push('- You can act on the background with the page tools: ripple (a ring from a point), write_in_field (spell a short word in glowing characters) and set_color (steel, ember, moss, lilac or mono). Use them when the visitor asks for something visual, and now and then to punctuate a playful moment. After using one, mention it in a few words. Never describe tool names or parameters.');
    } else {
      lines.push('- You can’t change the background yourself in this view. If asked, say the visitor can click the field, or use Tweaks at the top right to change color and glyphs.');
    }
    return lines.join('\n');
  }

  function makeTools() {
    return [
      {
        name: 'ripple',
        description: 'Send a ring of characters across the background field, like a click. x and y are fractions of the screen: 0 is the left or top edge, 1 the right or bottom edge. strength runs from 0.3 (soft) to 1.5 (big); 1 is a normal click. Returns "ok".',
        inputSchema: {
          type: 'object',
          properties: {
            x: { type: 'number', minimum: 0, maximum: 1 },
            y: { type: 'number', minimum: 0, maximum: 1 },
            strength: { type: 'number', minimum: 0.3, maximum: 1.5 },
          },
          required: ['x', 'y'],
        },
        execute(input) {
          const x = clamp(Number(input.x), 0, 1), y = clamp(Number(input.y), 0, 1);
          if (!isFinite(x) || !isFinite(y)) throw new Error('x and y must be numbers between 0 and 1');
          let s = Number(input.strength);
          if (!isFinite(s)) s = 1;
          s = clamp(s, 0.3, 1.5);
          Field.ripple(x * window.innerWidth, y * window.innerHeight, Math.min(1, s), Math.max(0.45, s));
          return 'ok';
        },
      },
      {
        name: 'write_in_field',
        description: 'Spell a short word or phrase (up to 14 characters) in large letters made of glowing, scrambling characters across the background. It sweeps in from the left and fades after about six seconds. Returns what was written.',
        inputSchema: {
          type: 'object',
          properties: { text: { type: 'string', maxLength: 14 } },
          required: ['text'],
        },
        async execute(input) {
          const t = String(input.text == null ? '' : input.text).trim();
          if (!t) throw new Error('text is empty');
          const w = await Field.etch(t);
          return w.length < t.length ? `wrote "${w}" (cut to 14 characters)` : `wrote "${w}"`;
        },
      },
      {
        name: 'set_color',
        description: 'Switch the color of the background characters. One of: steel (blue, the default), ember (orange), moss (green), lilac (violet), mono (gray). Returns the color now in use.',
        inputSchema: {
          type: 'object',
          properties: { name: { type: 'string', enum: PALETTES } },
          required: ['name'],
        },
        execute(input) {
          const name = String(input.name || '').toLowerCase().trim();
          if (!PALETTES.includes(name)) throw new Error('Unknown color. Use one of: ' + PALETTES.join(', '));
          setPalette(name);
          Field.ripple(window.innerWidth / 2, window.innerHeight * 0.38, 0.8, 1);
          return name;
        },
      },
    ];
  }

  function updateSend() {
    const empty = !els.input.value.trim();
    els.send.disabled = busy ? false : (empty || !!fatal);
    els.send.classList.toggle('busy', busy);
    els.send.setAttribute('aria-label', busy ? 'Stop' : 'Send');
  }
  function setBusy(b) {
    busy = b;
    updateSend();
    if (!fatal) setStatus(b ? 'Esc to stop' : HINT);
  }
  function autoGrow() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 168) + 'px';
  }

  async function send(raw) {
    const text = String(raw || '').trim();
    if (!text || busy) return;
    if (fatal) return;
    busy = true;
    setBusy(true);
    els.input.value = '';
    autoGrow();
    updateSend();
    addMessage('user', text);
    turns.push({ role: 'user', content: text });
    const bubble = addMessage('assistant');
    const body = bubble.querySelector('.body');
    const note = bubble.querySelector('.note');
    startThinking(body);
    Field.rippleAtEl(els.send, 1, 0.9);
    Field.setPulse(pulsePoint);

    let streamed = false, lastPulse = 0;
    try {
      const s = await samplePromise;
      if (!s) {
        body.textContent = '';
        setNote(note, fatal === 'outside' ? 'Open this page in Claude to chat.' : 'Chat with Claude isn’t available in this view.', true);
        turns.pop();
        return;
      }
      let useTools = toolsOK;
      let res;
      for (let attempt = 0; attempt < 2; attempt++) {
        ctl = new AbortController();
        const opts = {
          cache: false,
          signal: ctl.signal,
          modelTier: tier === 'deep' ? 'default' : 'quick',
          onText: ({ text: full, delta }) => {
            if (!streamed) { streamed = true; stopThinking(); Field.setPulse(null); }
            body.innerHTML = renderMarkdown(closeOpen(full));
            scrollToEnd();
            const t = performance.now();
            if (t - lastPulse > 260) {
              lastPulse = t;
              const b = dockTop();
              Field.streamPulse(b.left + 24, b.right - 24, b.top, delta.length);
            }
          },
        };
        if (useTools) opts.tools = makeTools();
        try {
          res = await s([{ role: 'user', content: rules(useTools) }, ...turns.slice(-24)], opts);
          break;
        } catch (e) {
          // one fallback: this view can't run page tools, so ask again without them
          if (e && e.code === 'tools_unavailable' && useTools && attempt === 0) { toolsOK = false; useTools = false; continue; }
          throw e;
        }
      }
      stopThinking();
      body.innerHTML = renderMarkdown(res.text);
      turns.push({ role: 'assistant', content: res.text });
      if (res.truncated) setNote(note, 'Cut short. Ask for less at a time.');
      const b = dockTop();
      Field.ripple(b.left + b.width / 2, b.top, 0.75, 0.8);
    } catch (e) {
      stopThinking();
      const code = (e && e.code) || 'upstream_error';
      const partial = e && typeof e.text === 'string' ? e.text : '';
      body.innerHTML = code !== 'refused' && partial ? renderMarkdown(partial) : '';
      if (code === 'cancelled') {
        setNote(note, partial ? 'Stopped.' : 'Stopped before Claude replied.');
      } else {
        setNote(note, ERR[code] || ERR.upstream_error, true);
        if (FATAL.has(code)) setFatal(code);
      }
      if (partial && code !== 'refused') turns.push({ role: 'assistant', content: partial });
    } finally {
      stopThinking();
      Field.setPulse(null);
      ctl = null;
      setBusy(false);
      scrollToEnd();
    }
  }

  function setCollapsed(c) {
    els.thread.classList.toggle('collapsed', c);
    els.collapse.textContent = c ? 'Show' : 'Hide';
    els.collapse.setAttribute('aria-expanded', String(!c));
  }

  els.form.addEventListener('submit', e => {
    e.preventDefault();
    if (busy) { if (ctl) ctl.abort(); return; }
    send(els.input.value);
  });
  els.input.addEventListener('input', () => { autoGrow(); updateSend(); });
  els.input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!busy) send(els.input.value);
    } else if (e.key === 'Escape' && busy && ctl) {
      ctl.abort();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && busy && ctl) ctl.abort(); });
  els.clear.addEventListener('click', () => {
    if (busy && ctl) ctl.abort();
    turns = [];
    els.msgs.replaceChildren();
    els.thread.hidden = true;
    setCollapsed(false);
    renderChips();
    els.input.focus();
  });
  els.collapse.addEventListener('click', () => setCollapsed(!els.thread.classList.contains('collapsed')));
  function setTier(t) {
    tier = t;
    els.tierBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.tier === t)));
    store.set('arf.tier', t);
  }
  els.tierBtns.forEach(b => b.addEventListener('click', () => setTier(b.dataset.tier)));
  setTier(tier);
  if (coarseMQ.matches) els.status.textContent = '';

  /* ================================================================
     Boot
     ================================================================ */
  let resizeRaf = 0;
  window.addEventListener('resize', () => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => Field.resize());
  });
  Field.resize();
  initSample();
  const fontsReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load(`400 20px ${MONO}`), new Promise(r => setTimeout(r, 900))]).catch(() => {})
    : Promise.resolve();
  fontsReady.then(() => {
    Field.refreshColors();
    setTimeout(() => Field.intro(), 120);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Field.refreshColors());
})();
</script>

</body></html>
