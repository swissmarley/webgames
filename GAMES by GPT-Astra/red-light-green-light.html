function applyQuality(){applyMaterialQuality();quality=presets[settings.quality];resolution=1;renderer.shadowMap.enabled=quality.shadows;sun.shadow.mapSize.set(quality.shadow,quality.shadow);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}dustGeometry.setDrawRange(0,quality.particles);dust.visible=quality.particles>0;renderer.shadowMap.needsUpdate=true;resize()}
window.addEventListener('resize',()=>{resize();renderUI(true)});
$('world').addEventListener('webglcontextlost',e=>{e.preventDefault();pauseRound();window.showFatal('WebGL context lost. Reload to recover. / WebGL 上下文已丢失。 / Se perdió el contexto WebGL.')});
async function toggleDebug(){debug=!debug;$('debug').style.display=debug?'block':'none';if(debug&&!gui){try{const {default:GUI}=await import('lil-gui');gui=new GUI({title:'Playground · tuning',width:240});gui.domElement.style.top='85px';gui.add(renderer,'toneMappingExposure',.7,1.8,.01);gui.add(scene.fog,'density',.001,.025,.001);gui.add(CONFIG,'steerSpeed',1,5,.1);gui.add(settings,'fov',42,78,1).onChange(v=>{$('fov').value=v});gui.add(settings,'reduced').onChange(()=>localize())}catch(e){toast('errorHelp')}}if(gui)gui.show(debug)}
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),lookSmoothed=new THREE.Vector3(0,2,14),heroOld={x:0,z:0};let visualTime=0;
function updateCharacters(){const p=game.player;hero.position.set(p.x,0,p.z);hero.rotation.set(0,0,0);if(game.state==='dying'||(game.state==='paused'&&game.previousState==='dying')||game.state==='lost'){const f=Math.min(1,game.deathTime/.95);hero.rotation.z=-f*1.45;hero.position.y=f*.14;poseHuman(hero,p.anim,false)}else{poseHuman(hero,p.anim,p.moving,game.state==='won');if(game.state==='won'&&!settings.reduced)hero.position.y=Math.abs(Math.sin(visualTime*3))*.08}
 for(const batch of crowdBatches)batch.count=0;
 for(let i=0;i<23;i++){const a=game.ai[i];if(a.moving)crowdPose[i]=Math.floor(((a.anim%(Math.PI*2))/(Math.PI*2))*POSES);const b=crowdBatches[crowdPose[i]];tempObj.position.set(a.x,a.alive?0:a.fall*.13,a.z);tempObj.rotation.set(0,0,a.alive?0:(i%2?1:-1)*a.fall*1.46);tempObj.scale.setScalar(.97+(i%4)*.018);tempObj.updateMatrix();b.setMatrixAt(b.count++,tempObj.matrix)}for(const b of crowdBatches)if(b.count)b.instanceMatrix.needsUpdate=true;
 for(let i=0;i<24;i++){const a=i===0?p:game.ai[i-1];tempObj.position.set(a.x,.008,a.z);tempObj.rotation.set(-Math.PI/2,0,0);tempObj.scale.set(a.alive?1:1.4,1,1);tempObj.updateMatrix();contact.setMatrixAt(i,tempObj.matrix)}contact.instanceMatrix.needsUpdate=true;
 let target=0;if(game.phase==='amber'){const f=Math.min(1,game.phaseElapsed/game.phaseDuration);target=Math.PI*(f*f*(3-2*f))}else if(game.phase==='red')target=Math.PI;else if(game.cycle>0){const f=Math.min(1,game.phaseElapsed/.65);target=Math.PI*(1-f*f*(3-2*f))}dollHead.rotation.y=target;
}
function updateCamera(dt){const p=game.player,portrait=innerWidth<innerHeight,ready=game.state==='ready';if(ready){camPos.set(portrait?2.5:7.5,portrait?7.8:7.5,portrait?-17:-14);camLook.set(0,2.8,23)}else{const distance=portrait?8.4:7.6;let death=game.state==='dying'||game.state==='lost'?Math.min(1,game.deathTime/1.65):0;camPos.set(p.x+Math.sin(lookYaw)*distance+death*1.5,4.0+lookPitch*5+death*.8,p.z-Math.cos(lookYaw)*distance-death*.4);camLook.set(p.x+Math.sin(lookYaw)*7,2.0+lookPitch*3,p.z+11);if(game.state==='won'){camPos.set(p.x+6,4.4,p.z+8);camLook.set(p.x,1.4,p.z)}}
 const blend=settings.reduced?1:1-Math.exp(-dt*5.7);camera.position.lerp(camPos,blend);lookSmoothed.lerp(camLook,blend);camera.lookAt(lookSmoothed);let desired=settings.fov+(!settings.reduced&&p.sprinting?3:0);camera.fov+=(desired-camera.fov)*(1-Math.exp(-dt*4));camera.updateProjectionMatrix();if(trauma>0&&!settings.reduced){const amp=trauma*trauma;camera.rotation.z+=Math.sin(visualTime*71)*amp*.018;camera.position.x+=Math.sin(visualTime*53)*amp*.07}trauma=Math.max(0,trauma-dt*1.2);if(game.deathTime>.35)$('flash').style.opacity='0';
 shadowAccumulator+=dt;if(shadowAccumulator>1/quality.shadowHz){shadowAccumulator=0;sun.position.set(p.x-23,38,p.z+15);sun.target.position.set(p.x,0,p.z+23);sun.target.updateMatrixWorld();renderer.shadowMap.needsUpdate=true}
}
function updateUIEffects(dt){if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').classList.remove('visible')}if(captionTime>0){captionTime-=dt;if(captionTime<=0)$('caption').style.opacity='0'}if(perfectTime>0){perfectTime-=dt;$('perfect').style.opacity=perfectTime>.2?'1':String(Math.max(0,perfectTime/.2))}else $('perfect').style.opacity='0'}
applyQuality();updateCharacters();renderUI(true);progress(91,'loadingWarmup');await nextPaint();camera.lookAt(0,2.8,23);if(renderer.extensions.has('KHR_parallel_shader_compile'))await renderer.compileAsync(scene,camera);else renderer.compile(scene,camera);renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);progress(100,'loadingWarmup');await nextPaint();$('loading').style.display='none';toast('assetToast',6);
let lastTime=performance.now(),accumulator=0,elapsedMeasure=0,measureFrames=0;
function frame(now){requestAnimationFrame(frame);const raw=(now-lastTime)/1000;lastTime=now;const dt=Math.min(.25,Math.max(0,raw));visualTime+=dt;pollGamepad();const action=input.sample();if(game.state!=='paused'){accumulator+=dt;let steps=0;while(accumulator>=CONFIG.fixedStep&&steps++<16){game.update(CONFIG.fixedStep,action);accumulator-=CONFIG.fixedStep}processEvents();updateEffects(dt);updateCharacters();audio.update(dt,game)}else accumulator=0;updateCamera(dt);updateUIEffects(dt);uiAccumulator+=dt;if(uiAccumulator>1/25||game.state!==lastState){renderUI();uiAccumulator=0}
 if(!settings.reduced&&game.state!=='paused'){dust.position.x=Math.sin(visualTime*.13)*.35;dust.position.y=Math.sin(visualTime*.22)*.08}
 renderer.render(scene,camera);if(raw>0){frameMean=frameMean*.97+raw*1000*.03;elapsedMeasure+=raw;measureFrames++;if(frameSamples.length<12000)frameSamples.push(raw*1000)}if(elapsedMeasure>=1){fps=measureFrames/elapsedMeasure;elapsedMeasure=0;measureFrames=0;if(debug)$('debug').textContent=`${fps.toFixed(1)} FPS · ${frameMean.toFixed(1)} ms\n${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} triangles\n${settings.quality} · scale ${resolution.toFixed(2)}\n${game.state} / ${game.phase} · seed ${game.seed}\nF3 / \` to hide`}
 dynamicCounter+=raw;if(dynamicCounter>3){dynamicCounter=0;const old=resolution;if(frameMean>22&&resolution>.65)resolution=Math.max(.65,resolution-.08);else if(frameMean<15&&resolution<1)resolution=Math.min(1,resolution+.04);if(old!==resolution)resize()}
}
requestAnimationFrame(frame);

window.playground={get snapshot(){return{state:game.state,previousState:game.previousState,phase:game.phase,phaseElapsed:game.phaseElapsed,phaseDuration:game.phaseDuration,time:game.time,remaining:42-game.time,seed:game.seed,player:{...game.player},ai:game.ai.map(a=>({...a})),effectiveMode:'procedural',tripoAvailable:false,settings:{...settings},input:{keys:Array.from(input.keys),pointer:input.pointer},audio:{state:audio.ctx?.state||'locked',shots:audio.shots},render:{fps,frameMean,resolution,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles}}},get frameTimings(){return frameSamples.slice()},get translations(){return I18N},get effectSlots(){return effects.length}};
}catch(error){window.showFatal(error)}
